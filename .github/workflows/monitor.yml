name: Fund Monitor

on:
  schedule:
    # 每周一 09:00 北京时间 = 01:00 UTC
    - cron: '0 1 * * 1'
    # 每天 14:30 北京时间 = 06:30 UTC
    - cron: '30 6 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portfolio-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install numpy pandas scipy matplotlib akshare requests schedule pyyaml

      - name: Run portfolio check
        run: |
          MPLBACKEND=Agg python run.py --portfolio > output.txt 2>&1 || {
            echo "Script failed, using fallback..."
            python -c "
          import akshare as ak
          codes = ['026200','023452','014320']
          names = ['大摩港通多元成长混合C','中欧信息科技混合发起C','德邦半导体产业混合发起式C']
          for c,n in zip(codes,names):
              try:
                  df = ak.fund_open_fund_info_em(symbol=c, indicator='单位净值走势')
                  if df is not None and len(df) > 0:
                      latest = df.iloc[-1]
                      print(f'{n}: 净值 {latest[\"单位净值\"]} 日期 {latest[\"日期\"]}')
              except Exception as e:
                  print(f'{n}: fetch failed - {e}')
          " > output.txt 2>&1
          }

      - name: Notify via DingTalk
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('output.txt', 'utf8').substring(0, 20000);

            const webhook = process.env.DINGTALK_WEBHOOK;
            const secret = process.env.DINGTALK_SECRET;

            if (!webhook) {
              console.log('DINGTALK_WEBHOOK not set, skipping notification');
              return;
            }

            // Build URL with signature if secret provided
            let url = webhook;
            if (secret) {
              const crypto = require('crypto');
              const timestamp = Date.now().toString();
              const stringToSign = timestamp + '\n' + secret;
              const sign = crypto.createHmac('sha256', secret).update(stringToSign).digest('base64');
              url = webhook + '&timestamp=' + timestamp + '&sign=' + encodeURIComponent(sign);
            }

            const now = new Date().toISOString().slice(0, 16).replace('T', ' ');
            const body = {
              msgtype: 'markdown',
              markdown: {
                title: '📋 持仓监测 — ' + now,
                text: '## 📋 持仓监测 — ' + now + ' UTC\n\n```\n' + output + '\n```\n\n---\n> 每日自动监测 · GitHub Actions'
              }
            };

            const https = require('https');
            const { URL } = require('url');
            const parsedUrl = new URL(url);
            const data = JSON.stringify(body);

            await new Promise((resolve, reject) => {
              const req = https.request({
                hostname: parsedUrl.hostname,
                path: parsedUrl.pathname + parsedUrl.search,
                method: 'POST',
                headers: { 'Content-Type': 'application/json' }
              }, res => {
                let b = '';
                res.on('data', d => b += d);
                res.on('end', () => { console.log('DingTalk:', b); resolve(); });
              });
              req.on('error', reject);
              req.write(data);
              req.end();
            });
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
